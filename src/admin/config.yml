backend:
  name: github
  repo: p3arldiv3r/lily-portfolio
  branch: main
  base_url: https://lilytrent.pages.dev
  auth_endpoint: /api/auth

media_folder: "src/images"
public_folder: "/images"

publish_mode: simple

collections:
  - name: "posts"
    label: "Writing"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "One or two sentences shown on the writing list." }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Gallery"
    files:
      - file: "src/_data/gallery.json"
        label: "Art pieces"
        name: "gallery"
        fields:
          - label: "Art pieces"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Image (square canvases work best)", name: "image", widget: "image", media_folder: "/src/images/gallery", public_folder: "/images/gallery" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Alt text (for screen readers)", name: "alt", widget: "string", required: false, hint: "Describe what's in the image. Falls back to the title if left blank." }
              - { label: "Caption", name: "caption", widget: "string", required: false, hint: "One line, shown under the piece." }

  - name: "doodles"
    label: "Doodles"
    files:
      - file: "src/_data/doodles.json"
        label: "Approved doodles"
        name: "doodles"
        fields:
          - label: "Approved doodles"
            name: "items"
            widget: "list"
            summary: "{{fields.display}} — {{fields.caption}}"
            fields:
              - { label: "Image", name: "image", widget: "image", media_folder: "/src/images/doodles", public_folder: "/images/doodles" }
              - label: "Display as"
                name: "display"
                widget: "select"
                default: "sticky"
                options:
                  - { label: "Sticky note", value: "sticky" }
                  - { label: "Low-opacity background", value: "background" }
              - { label: "Left (px from the desktop's left edge)", name: "left", widget: "number", value_type: "int", default: 200 }
              - { label: "Top (px from the desktop's top edge)", name: "top", widget: "number", value_type: "int", default: 200 }
              - { label: "Caption (shown on sticky notes only)", name: "caption", widget: "string", required: false }

  - name: "projects"
    label: "Class Projects"
    files:
      - file: "src/_data/projects.json"
        label: "Projects"
        name: "projects"
        fields:
          - label: "Projects"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Class/course", name: "course", widget: "string", required: false, hint: "e.g. CS 3510" }
              - label: "Status"
                name: "status"
                widget: "select"
                default: "in-progress"
                options:
                  - { label: "In progress", value: "in-progress" }
                  - { label: "Done", value: "done" }
                  - { label: "On hold", value: "on-hold" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Repo link", name: "repo", widget: "string", required: false }
              - { label: "Demo link", name: "demo", widget: "string", required: false }
